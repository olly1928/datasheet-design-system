<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Box data sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Box data sheet / solution brief template
   Values measured from the source artwork - reference/DESIGN-SPEC.md
   Do not edit per customer. Edit content/<customer>.json instead.
   ============================================================ */
:root{
  --box-blue:#0061D5;
  --blue-tint:#78ADF7;      /* eyebrow on the deep blue band */
  --icon-2:#A8CBF5;         /* duotone secondary */
  --band-from:#002959;
  --band-to:#003C83;
  --ink:#151F26;
  --body:#636D78;
  --label:#9AA1AA;
  --panel:#F5F6F8;
  --card:#E5EFFA;
  --rule:#E2E6EB;
  --page-bg:#FFFFFF;
  --pill-blue-bg:#E5EFFA; --pill-blue:#0061D5;
  --pill-green-bg:#E4F4EA; --pill-green:#177F45;

  /* A4 is the default page size. Letter is the override below. */
  --pw:794px; --ph:1123px;
  --margin:48px; --main:462px; --gutter:27px; --aside:257px;
  --band-h:219px;
  --foot-h:26px;

  --s1:8px; --s2:12px; --s3:16px; --s4:22px; --s5:26px; --s6:38px;
}
html[data-size="letter"]{ --pw:816px; --ph:1056px; --main:478px; --aside:263px; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#4a4a4a;
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-optical-sizing:auto;
  color:var(--body);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--box-blue);text-decoration:none}
a:hover{color:#004aa8}

.page{
  position:relative;
  width:var(--pw); height:var(--ph);
  background:var(--page-bg);
  margin:24px auto;
  overflow:hidden;
  box-shadow:0 2px 18px rgba(0,0,0,.28);
  display:flex; flex-direction:column;
}

/* ---------- header band (page 1) ---------- */
.band{
  position:relative; flex:0 0 var(--band-h); height:var(--band-h);
  background:linear-gradient(90deg,var(--band-from),var(--band-to));
  padding:32px var(--margin) 30px;
  display:flex; flex-direction:column; justify-content:space-between;
  overflow:hidden;
}
.band__top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.boxmark{display:block;height:26px;width:auto;flex:0 0 auto;color:#fff}
.band__btm{max-width:600px}
.eyebrow{
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue-tint);margin:0 0 9px;
}
.band h1{
  font-size:24px;line-height:1.26;font-weight:600;letter-spacing:-.018em;
  color:#fff;margin:0;text-wrap:balance;
}

/* ---------- customer logo, top right of the band ---------- */
.cxlogo{display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:238px}
.cxlogo__label{
  font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.5);white-space:nowrap;
}
.cxlogo__slot{display:flex;align-items:center;justify-content:flex-end;min-height:42px}
.cxlogo img,.cxlogo svg{display:block;max-width:238px;object-fit:contain;object-position:right center}
.cxlogo--reverse img,.cxlogo--reverse svg{filter:brightness(0) invert(1)}
.cxlogo--plate .cxlogo__slot{
  background:#fff;border-radius:8px;padding:11px 15px;
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.10);
}
.cxlogo--wordmark .cxlogo__slot{
  font-size:22px;font-weight:600;letter-spacing:-.02em;color:#fff;line-height:1.15;text-align:right;
}
/* optical sizing - a wide wordmark and a square mark at one pixel height
   do not read as the same size */
.cxlogo[data-aspect="wordmark"] img,.cxlogo[data-aspect="wordmark"] svg{height:30px;max-height:30px}
.cxlogo[data-aspect="mark"]     img,.cxlogo[data-aspect="mark"]     svg{height:44px;max-height:44px}
.cxlogo[data-aspect="stacked"]  img,.cxlogo[data-aspect="stacked"]  svg{height:56px;max-height:56px}

/* ---------- body: main + aside ---------- */
.body{flex:1 1 auto;display:flex;min-height:0}
.main{
  /* main content column is --main wide; padding sits outside it */
  width:calc(var(--main) + var(--margin) + var(--gutter));
  padding:var(--s6) var(--gutter) var(--s3) var(--margin);
  display:flex;flex-direction:column;gap:var(--s5);
}
.aside{
  width:var(--aside); background:var(--panel);
  padding:var(--s6) var(--margin) var(--s3) var(--s4);
  display:flex;flex-direction:column;gap:var(--s5);
}
.page--plain .main,.page--plain .aside{padding-top:var(--s6)}

/* ---------- type ---------- */
h1.hero{font-size:31px;line-height:1.15;font-weight:600;color:var(--ink);letter-spacing:-.024em;margin:0 0 var(--s3);text-wrap:pretty}
.deck{font-size:17px;line-height:1.32;font-weight:600;color:var(--ink);margin:0;letter-spacing:-.008em}
h2{font-size:27px;line-height:1.18;font-weight:600;color:var(--ink);margin:0 0 var(--s3);letter-spacing:-.022em}
h3{font-size:17px;line-height:1.28;font-weight:600;color:var(--ink);margin:0 0 var(--s2);letter-spacing:-.01em}
.aside h3{font-size:17px}
p{font-size:12.4px;line-height:1.52;margin:0 0 var(--s2)}
p:last-child{margin-bottom:0}
b,strong{font-weight:600;color:var(--ink)}
.lbl{
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--label);margin:0 0 var(--s2);
}
.rule{height:1px;background:var(--rule);border:0;margin:0}

/* ---------- blocks ---------- */
.blk{break-inside:avoid}
.blk--pin{margin-top:auto}

/* hero */
.hero-blk{}

/* steps - numbered circles */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.steps--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.step__n{
  width:21px;height:21px;border-radius:50%;background:var(--box-blue);color:#fff;
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
  margin-bottom:11px;
}
.step__t{font-size:12.4px;font-weight:600;color:var(--box-blue);line-height:1.3;margin-bottom:8px}
.step p{font-size:12.4px;line-height:1.5;margin:0}

/* deflist - bold lead one-liners */
.deflist{display:flex;flex-direction:column;gap:11px}
.deflist p{font-size:12.4px;line-height:1.45;margin:0}

/* featurelist - two columns, icon in a left gutter */
.flist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s3)}
.flist--1{grid-template-columns:1fr}
.fitem{display:flex;gap:11px;align-items:flex-start}
.fitem>svg{width:19px;height:19px;flex:0 0 19px;color:var(--box-blue);margin-top:1px}
.fitem__t{font-size:12.4px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:3px}
.fitem p{font-size:12.4px;line-height:1.48;margin:0}

/* caps - three across, icon inline with the title */
.caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) var(--s3);align-items:start}
.caps--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cap__hd{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px;min-height:32px}
.cap__hd svg{width:16px;height:16px;flex:0 0 16px;color:var(--box-blue);margin-top:1px}
.cap__hd span{font-size:12.4px;font-weight:600;color:var(--box-blue);line-height:1.25}
.cap p{font-size:12px;line-height:1.48;margin:0}
.cap ul{list-style:none;margin:var(--s2) 0 0;padding:0}
.cap li{font-size:11px;font-weight:600;color:var(--ink);line-height:1.72}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.cards--1{grid-template-columns:1fr}
.card{background:var(--card);border-radius:12px;padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:10px}
.card>svg{width:22px;height:22px;color:var(--box-blue)}
.card__t{font-size:12.4px;font-weight:600;color:var(--box-blue);line-height:1.3}
.card p{font-size:11.8px;line-height:1.48}

/* panel - pale callout with an optional logo row */
.panel{background:var(--card);border-radius:12px;padding:var(--s4) var(--s4) var(--s4)}
.panel h3{margin-bottom:9px}
.panel p{font-size:12.4px;line-height:1.5}
.panel__logos{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s4)}
.panel__logos img,.panel__logos svg{height:22px;width:auto;max-width:100%;object-fit:contain}

/* figure */
.figure{margin:0}
.figure--sized{display:flex;flex-direction:column;align-items:center}
.figure--sized figcaption{align-self:stretch}
.figure img,.figure svg{display:block;width:100%;height:auto;border-radius:8px}
.figure--sized>span{display:block}
.figure figcaption{font-size:10.6px;line-height:1.45;color:var(--label);margin-top:10px}

/* learn more */
.learn{font-size:12.4px;line-height:1.5;margin:0}
.learn a{font-weight:600}

/* quote - Frasers treatment: bold ink, no rule */
.quote__t{font-size:14.5px;line-height:1.38;font-weight:600;color:var(--ink);margin:0 0 11px;letter-spacing:-.008em}
.quote__a{font-size:11px;line-height:1.45;margin:0;color:var(--body)}
.quote__a b{display:block;font-weight:400;color:var(--body)}

/* statlist - large numeral, stacked */
.statlist{display:flex;flex-direction:column;gap:var(--s4)}
.stat__n{font-size:26px;font-weight:600;color:var(--box-blue);line-height:1.05;letter-spacing:-.028em}
.stat__l{font-size:12.4px;line-height:1.45;margin-top:6px}

/* stats - boxed tiles */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.stats--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat-tile{background:var(--card);border-radius:10px;padding:var(--s3)}
.stat-tile .stat__l{font-size:11px}

/* logos */
.logostack{display:flex;flex-direction:column;align-items:center;gap:var(--s5)}
.logostack img,.logostack svg{max-height:34px;max-width:70%;width:auto;height:auto;object-fit:contain}
.logogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s2);align-items:center;justify-items:center}
.logogrid img,.logogrid svg{max-height:26px;max-width:100%;width:auto;object-fit:contain}
.logobar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4)}
.logobar img,.logobar svg{height:22px;width:auto}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:11px;font-weight:600;line-height:1;padding:7px 11px;border-radius:20px;white-space:nowrap}
.pill--blue{background:var(--pill-blue-bg);color:var(--pill-blue)}
.pill--green{background:var(--pill-green-bg);color:var(--pill-green)}
.pill--plain{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}

/* lists */
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bullets li{font-size:12.4px;line-height:1.45;padding-left:12px;position:relative}
.bullets li::before{content:"";position:absolute;left:0;top:7px;width:3px;height:3px;border-radius:50%;background:var(--body)}
.linklist{display:flex;flex-direction:column;gap:var(--s4)}
.linklist__row{display:flex;gap:11px;align-items:flex-start}
.linklist__row>svg{width:19px;height:19px;flex:0 0 19px;color:var(--box-blue);margin-top:1px}
.linklist__t{font-size:12.4px;font-weight:600;color:var(--ink);margin-bottom:3px}
.linklist p{font-size:12px;line-height:1.45;margin:0}

/* note */
.note{font-size:11.6px;line-height:1.5;margin:0}

/* cta */
.cta{background:var(--band-from);border-radius:12px;padding:var(--s4);color:#fff;display:flex;flex-direction:column;gap:10px}
.cta h2{color:#fff;margin:0;font-size:17px;letter-spacing:-.012em}
.cta p{color:rgba(255,255,255,.8);font-size:12px;margin:0}
.cta__a{font-size:12px;font-weight:600;color:#fff;margin-top:2px}

.footnote{margin-top:auto;padding-top:var(--s2);border-top:1px solid var(--rule);font-size:9px;line-height:1.5}

/* ---------- footer: the AI disclosure strip (page 2 only) ---------- */
/* The strip is sized by Legal's wording, not the other way round: it holds
   --foot-h at minimum and grows if the disclosure runs longer. Never clip it -
   a half-visible AI disclosure is worse than a slightly taller footer. */
.foot{
  flex:0 0 auto;min-height:var(--foot-h);
  display:flex;align-items:center;gap:var(--s3);
  padding:5px var(--margin);
  border-top:1px solid var(--rule);
  background:var(--page-bg);
}
.foot__legal{flex:1 1 auto;font-size:7.6px;line-height:1.35;color:#8b939d}
.foot__meta{flex:0 0 auto;font-size:7.6px;color:#a2a9b2;white-space:nowrap}

/* ---------- overflow detector ---------- */
.overflow-warn{position:absolute;left:0;right:0;bottom:0;height:4px;background:#E5484D;z-index:99;box-shadow:0 0 0 1px #fff}
.overflow-warn::after{
  content:"CONTENT OVERFLOWS THIS PAGE";
  position:absolute;right:6px;bottom:6px;
  font-size:8px;font-weight:700;letter-spacing:.08em;color:#E5484D;
}
@media print{ .overflow-warn{display:none} }

/* Fallback only. The renderer replaces this with the size the content file asks
   for - without it an A4 layout prints onto a Letter sheet and spills to 4 pages. */
@page{ size:A4; margin:0 }
@media print{
  body{background:#fff}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
}
</style>
</head>

  <symbol id="i-bulb" viewBox="0 0 24 24"><path opacity=".34" fill="currentColor" d="M12 2.6a7 7 0 0 1 4.2 12.6c-.6.5-1 1.2-1 2v.6H8.8v-.6c0-.8-.4-1.5-1-2A7 7 0 0 1 12 2.6Z"/><path fill="currentColor" d="M9.2 18.6h5.6a.9.9 0 0 1 0 1.8H9.2a.9.9 0 0 1 0-1.8Zm1 3h3.6a.9.9 0 0 1 0 1.8h-3.6a.9.9 0 0 1 0-1.8Z"/></symbol>

<div id="doc"></div>

<script id="content" type="application/json">
{"customer":"","meta":{},"pages":[]}
</script>

<script>
/* ============================================================
   Renderer. Reads the JSON above and builds both pages.
   Per customer, ONLY the JSON block changes - never this code.
   ============================================================ */
(function(){
  var C;
  try { C = JSON.parse(document.getElementById('content').textContent); }
  catch(err){ document.body.innerHTML = '<pre style="color:#fff;padding:24px">Content JSON is invalid:\n'+err.message+'</pre>'; return; }

  var e = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  /* a deliberately tiny inline pass: **bold** and [text](url), so copy can carry
     a bold lead-in and a link the way the source sheets do */
  var rt = function(s){ return e(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>'); };
  var icon = function(n){ return n ? '<svg><use href="#i-'+e(n)+'"/></svg>' : ''; };
  var img = function(o, cls){
    if(!o) return '';
    if(o.svg) return o.svg;
    if(!o.src) return '';
    return '<img class="'+(cls||'')+'" src="'+e(o.src)+'" alt="'+e(o.alt||'')+'">';
  };
  var paras = function(b){
    return (b.paragraphs || [b.body || b.text]).filter(Boolean)
      .map(function(p){ return '<p>'+rt(p)+'</p>'; }).join('');
  };

  /* ---------- block renderers ---------- */
  var R = {
    hero: function(b){
      return '<h1 class="hero">'+e(b.headline)+'</h1>'
        + (b.deck ? '<p class="deck">'+rt(b.deck)+'</p>' : '');
    },
    text: paras,
    section: function(b){
      var H = b.level === 3 ? 'h3' : 'h2';
      return (b.heading ? '<'+H+'>'+e(b.heading)+'</'+H+'>' : '') + paras(b);
    },
    steps: function(b){
      var items = b.items || [];
      var cols = items.length === 2 ? ' steps--2' : '';
      return (b.heading ? '<h3>'+e(b.heading)+'</h3>' : '')
        + '<div class="steps'+cols+'">' + items.map(function(i, n){
          return '<div class="step"><div class="step__n">'+(n+1)+'</div>'
            + '<div class="step__t">'+e(i.title)+'</div>'
            + (i.body ? '<p>'+rt(i.body)+'</p>' : '') + '</div>';
        }).join('') + '</div>';
    },
    deflist: function(b){
      return (b.heading ? '<h3>'+e(b.heading)+'</h3>' : '')
        + '<div class="deflist">' + (b.items||[]).map(function(i){
          return '<p><b>'+e(i.term)+':</b> '+rt(i.body)+'</p>';
        }).join('') + '</div>';
    },
    featurelist: function(b){
      var one = b.columns === 1 ? ' flist--1' : '';
      return (b.heading ? '<h2>'+e(b.heading)+'</h2>' : '')
        + '<div class="flist'+one+'">' + (b.items||[]).map(function(i){
          return '<div class="fitem">'+icon(i.icon)+'<div>'
            + '<div class="fitem__t">'+e(i.title)+'</div>'
            + (i.body ? '<p>'+rt(i.body)+'</p>' : '') + '</div></div>';
        }).join('') + '</div>';
    },
    caps: function(b){
      var cols = b.columns === 2 ? ' caps--2' : '';
      return (b.heading ? '<h2>'+e(b.heading)+'</h2>' : '')
        + '<div class="caps'+cols+'">' + (b.items||[]).map(function(i){
          return '<div class="cap"><div class="cap__hd">'+icon(i.icon)+'<span>'+e(i.title)+'</span></div>'
            + (i.body ? '<p>'+rt(i.body)+'</p>' : '')
            + (i.list && i.list.length ? '<ul>'+i.list.map(function(l){ return '<li>'+e(l)+'</li>'; }).join('')+'</ul>' : '')
            + '</div>';
        }).join('') + '</div>';
    },
    cards: function(b){
      var one = (b.items||[]).length === 1 ? ' cards--1' : '';
      return (b.heading ? '<h2>'+e(b.heading)+'</h2>' : '')
        + '<div class="cards'+one+'">' + (b.items||[]).map(function(i){
          return '<div class="card">'+icon(i.icon)
            + '<div class="card__t">'+e(i.title)+'</div>' + paras(i) + '</div>';
        }).join('') + '</div>';
    },
    panel: function(b){
      return '<div class="panel">' + (b.heading ? '<h3>'+e(b.heading)+'</h3>' : '') + paras(b)
        + (b.logos && b.logos.length
            ? '<div class="panel__logos">' + b.logos.map(function(l){ return img(l); }).join('') + '</div>'
            : '')
        + '</div>';
    },
    figure: function(b){
      var wpc = Number(b.width) > 0 ? Math.min(100, Number(b.width)) : 100;
      var st = wpc < 100 ? ' style="width:'+wpc+'%"' : '';
      return '<figure class="figure'+(wpc<100?' figure--sized':'')+'">'
        + (wpc < 100 ? '<span'+st+'>'+img(b.image)+'</span>' : img(b.image))
        + (b.caption ? '<figcaption>'+rt(b.caption)+'</figcaption>' : '') + '</figure>';
    },
    learnmore: function(b){
      return '<p class="learn">'+rt(b.text)+'</p>';
    },
    quote: function(b){
      return '<p class="quote__t">“'+e(b.text)+'”</p>'
        + '<p class="quote__a"><b>'+e(b.name)+'</b>'+e(b.role||'')+'</p>';
    },
    statlist: function(b){
      return '<div class="statlist">' + (b.items||[]).map(function(i){
        return '<div class="stat"><div class="stat__n">'+e(i.value)+'</div>'
          + '<div class="stat__l">'+rt(i.label)+'</div></div>';
      }).join('') + '</div>';
    },
    stats: function(b){
      var two = (b.items||[]).length === 2 ? ' stats--2' : '';
      return (b.heading ? '<h2>'+e(b.heading)+'</h2>' : '')
        + '<div class="stats'+two+'">' + (b.items||[]).map(function(i){
          return '<div class="stat-tile"><div class="stat__n">'+e(i.value)+'</div>'
            + '<div class="stat__l">'+rt(i.label)+'</div></div>';
        }).join('') + '</div>';
    },
    logostack: function(b){
      return '<div class="logostack">' + (b.logos||[]).map(function(l){ return img(l); }).join('') + '</div>';
    },
    logogrid: function(b){
      return '<div class="logogrid">' + (b.logos||[]).map(function(l){ return img(l); }).join('') + '</div>';
    },
    logobar: function(b){
      return '<div class="logobar">' + (b.logos||[]).map(function(l){ return img(l); }).join('') + '</div>';
    },
    pills: function(b){
      return '<div class="pills">' + (b.items||[]).map(function(i){
        var tone = i.tone || 'plain';
        return '<span class="pill pill--'+e(tone)+'">'+e(i.text||i)+'</span>';
      }).join('') + '</div>';
    },
    bullets: function(b){
      return (b.heading ? '<h3>'+e(b.heading)+'</h3>' : '')
        + '<ul class="bullets">' + (b.items||[]).map(function(i){ return '<li>'+rt(i)+'</li>'; }).join('') + '</ul>';
    },
    linklist: function(b){
      return (b.heading ? '<h3>'+e(b.heading)+'</h3>' : '')
        + '<div class="linklist">' + (b.items||[]).map(function(i){
          return '<div class="linklist__row">'+icon(i.icon)+'<div>'
            + '<div class="linklist__t">'+e(i.title)+'</div>'
            + '<p>'+rt(i.body)+'</p></div></div>';
        }).join('') + '</div>';
    },
    note: function(b){ return '<p class="note">'+rt(b.text||b.body)+'</p>'; },
    rule: function(){ return '<hr class="rule">'; },
    cta: function(b){
      return '<div class="cta"><h2>'+e(b.heading)+'</h2>'
        + (b.body ? '<p>'+rt(b.body)+'</p>' : '')
        + (b.action ? '<div class="cta__a">'+e(b.action)+'</div>' : '') + '</div>';
    },
    footnote: function(b){
      return '<div class="footnote">' + (b.items||[b.text]).filter(Boolean).map(rt).join('<br>') + '</div>';
    }
  };

  /* assurances share the linklist's shape: icon, bold title, one line of body */
  R.assurances = R.linklist;

  var render = function(blocks){
    return (blocks||[]).map(function(b){
      var fn = R[b.type];
      if(!fn) return '<div class="blk"><p style="color:#E5484D">Unknown block type: '+e(b.type)+'</p></div>';
      if(b.type === 'rule') return fn(b);
      var cls = 'blk' + (b.pin === 'bottom' ? ' blk--pin' : '');
      var lbl = b.label ? '<p class="lbl">'+e(b.label)+'</p>' : '';
      return '<div class="'+cls+'">' + lbl + fn(b) + '</div>';
    }).join('');
  };

  /* ---------- the customer logo, top right of the band ---------- */
  var logo = function(L, customer){
    if(!L || L.tier === 'none') return '<span></span>';
    var tier = L.tier || 'plate';
    var inner = (tier === 'wordmark' || (!L.src && !L.svg))
      ? e(L.name || customer) : img(L, '');
    return '<div class="cxlogo cxlogo--'+e(tier)+'" data-aspect="'+e(L.aspect || 'wordmark')+'">'
      + (L.label === null || L.label === '' ? '' : '<div class="cxlogo__label">'+e(L.label || 'Prepared for')+'</div>')
      + '<div class="cxlogo__slot">'+inner+'</div></div>';
  };

  /* ---------- assemble ---------- */
  var M = C.meta || {};
  /* A4 is the default. The layout variables and the @page size have to agree:
     if they don't, the sheet lays out at one size and prints at another, which
     is how an A4 sheet ends up spilling across four Letter pages. */
  var SIZE = M.size === 'letter' ? 'letter' : 'a4';
  document.documentElement.setAttribute('data-size', SIZE);
  var pageRule = document.createElement('style');
  pageRule.textContent = '@page{size:' + (SIZE === 'letter' ? 'letter' : 'A4') + ';margin:0}';
  document.head.appendChild(pageRule);
  if (M.title) document.title = M.title + (C.customer ? ' — ' + C.customer : '');

  var EYEBROW = { 'solution-brief':'Solution brief', 'datasheet':'Data sheet' };
  var eyebrow = M.eyebrow != null ? M.eyebrow : (EYEBROW[M.type] || EYEBROW['solution-brief']);

  /* The Box wordmark. Genuine vector artwork extracted from the ICM data sheet
     with scripts/extract_vector_from_pdf.py - see brand/LOGO-RULES.md.
     Do not redraw it. To regenerate:
       python3 scripts/extract_vector_from_pdf.py \
         reference/source-datasheet-icm-0425.pdf \
         --region 30,735,85,780 --label Box --out assets/box-logo-white.svg */
  var BOXMARK = '<svg class="boxmark" viewBox="0 0 39.20 20.72" fill="currentColor" role="img" aria-label="Box"><path d="M20.004,6.062C17.236,6.062 14.831,7.618 13.616,9.904C12.403,7.618 9.998,6.062 7.230,6.062C5.604,6.062 4.101,6.599 2.892,7.507L2.892,1.417C2.876,0.631 2.235,0.000 1.446,0.000C0.656,0.000 0.018,0.631 0.000,1.417L0.000,13.411L0.003,13.411C0.066,17.349 3.277,20.522 7.230,20.522C9.998,20.522 12.403,18.965 13.616,16.681C14.831,18.965 17.236,20.522 20.004,20.522C23.996,20.522 27.234,17.285 27.234,13.292C27.234,9.299 23.996,6.062 20.004,6.062M7.230,17.628C4.836,17.628 2.892,15.687 2.892,13.292C2.892,10.896 4.836,8.956 7.230,8.956C9.624,8.956 11.567,10.896 11.567,13.292C11.567,15.687 9.624,17.628 7.230,17.628M20.004,17.628C17.608,17.628 15.667,15.687 15.667,13.292C15.667,10.896 17.608,8.956 20.004,8.956C22.400,8.956 24.340,10.896 24.340,13.292C24.340,15.687 22.400,17.628 20.004,17.628"/><path d="M38.704,18.247L34.676,13.298L38.704,8.348C39.201,7.710 39.057,6.820 38.372,6.345C37.684,5.872 36.717,5.993 36.187,6.611L36.187,6.610L32.710,10.882L29.233,6.610L29.233,6.611C28.706,5.993 27.735,5.872 27.049,6.348C26.363,6.822 26.219,7.710 26.720,8.348L26.717,8.348L30.745,13.298L26.717,18.247L26.720,18.247C26.219,18.886 26.363,19.775 27.049,20.248C27.735,20.723 28.706,20.603 29.233,19.984L32.710,15.712L36.187,19.984C36.717,20.603 37.684,20.723 38.372,20.249C39.057,19.775 39.201,18.886 38.704,18.247"/></svg>';

  var pages = C.pages || [];
  var html = pages.map(function(P, i){
    var band = P.band
      ? '<div class="band"><div class="band__top">' + BOXMARK + logo(C.logo, C.customer) + '</div>'
        + '<div class="band__btm">'
        + (eyebrow ? '<p class="eyebrow">'+e(eyebrow)+'</p>' : '')
        + '<h1>'+e(M.title || '')+'</h1></div></div>'
      : '';
    /* the AI disclosure sits on the last page only */
    var foot = (i === pages.length - 1)
      ? '<div class="foot"><div class="foot__legal">'+e(C.legal || '')+'</div>'
        + '<div class="foot__meta">'+e(M.footerMeta || 'box.com')+'</div></div>'
      : '';
    return '<div class="page'+(P.band?'':' page--plain')+'">' + band
      + '<div class="body"><div class="main">'+render(P.main)+'</div>'
      + '<div class="aside">'+render(P.aside)+'</div></div>'
      + foot + '</div>';
  }).join('');

  document.getElementById('doc').innerHTML = html;

  /* ---------- overflow detection ----------
     The validator does arithmetic before render; this measures the real thing
     after it, so a page that overflows cannot quietly reach a customer. */
  requestAnimationFrame(function(){
    document.querySelectorAll('.page').forEach(function(pg){
      var over = false;
      pg.querySelectorAll('.main,.aside,.foot__legal').forEach(function(col){
        if (col.scrollHeight - col.clientHeight > 1) over = true;
      });
      if (over) {
        var w = document.createElement('div');
        w.className = 'overflow-warn';
        pg.appendChild(w);
        console.warn('[datasheet] content overflows page', pg);
      }
    });
  });
})();
</script>
